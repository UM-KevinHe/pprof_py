[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pprof_py"
version = "0.4.0"
description = "General statistical-computing package for provider profiling and healthcare analytics (logistic, linear, and Cox survival models)."
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kevin He", email = "kevinhe@umich.edu"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "numba>=0.56",
    "fast_poibin>=0.4",
]

[project.urls]
Homepage = "https://github.com/UM-KevinHe/pprof_py"

[project.optional-dependencies]
dev = ["pytest>=7.0", "statsmodels>=0.13"]
docs = [
    "sphinx>=6.0",
    "shibuya>=2024.8",
    "myst-parser>=1.0",
    "sphinxcontrib-bibtex>=2.5",
    "matplotlib>=3.5",
]
# Optional solver used by LogisticRandomEffectModel; scipy fallbacks are
# used automatically when nlopt is unavailable.
random-effect = ["nlopt"]
# R interoperability tools for comparison and validation workflows;
# never imported by the package itself.
legacy = ["rpy2", "pymer4"]

[tool.setuptools.packages.find]
include = ["pprof_py*"]
exclude = ["pprof_py.tests*"]
