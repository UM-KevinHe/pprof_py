# setup.cfg  —  kept in sync with pyproject.toml (the canonical source)
[metadata]
name = pprof_py
version = attr: pprof_py.__version__
author = Kevin He
author_email = kevinhe@umich.edu
description = General statistical-computing package for provider profiling and healthcare analytics (logistic, linear, and Cox survival models).
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/UM-KevinHe/pprof_py
license = MIT
license_files = LICENSE.md
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    Intended Audience :: Healthcare Industry
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Medical Science Apps.

[options]
package_dir =
    = .
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.23
    pandas>=1.5
    scipy>=1.9
    scikit-learn>=1.0
    matplotlib>=3.5
    seaborn>=0.12
    numba>=0.56
    fast_poibin>=0.4

[options.extras_require]
dev = pytest>=7.0; statsmodels>=0.13
random-effect = nlopt
legacy = rpy2; pymer4

[options.packages.find]
where = .
include = pprof_py*
exclude = pprof_py.tests*
